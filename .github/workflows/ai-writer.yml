name: ChatGPT Automated Writer

on:
  push:
    branches: [ main ]

jobs:
  ai-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Trigger ChatGPT Automation Action
        id: chatgpt
        uses: cahaseler/openai-chatgpt-action@v1
        with:
          apiKey: ${{ secrets.OPENAI_API_KEY }}
          model: "gpt-4o"
          prompt: "Génère un fichier README.md complet et clair en français pour décrire ce projet React."
