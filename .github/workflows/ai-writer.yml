name: ChatGPT Automated Writer

on:
  push:
    branches: [ main ]

jobs:
  ai-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Capture Real OpenAI Error
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e "
          async function run() {
            try {
              const res = await fetch('https://openai.com', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + process.env.OPENAI_API_KEY
                },
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [{role: 'user', content: 'Test'}]
                })
              });
              
              console.log('Code Statut HTTP :', res.status);
              const textOutput = await res.text();
              console.log('=== TEXTE EN BRUT REÇU DU SERVEUR ===');
              console.log(textOutput.substring(0, 500)); // Affiche les 500 premiers caractères du HTML
              console.log('======================================');
              process.exit(1);
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          }
          run();
          "
