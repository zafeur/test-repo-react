name: ChatGPT Automated Writer

on:
  push:
    branches: [ main ]

jobs:
  ai-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Call OpenAI API safely
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          async function run() {
            try {
              if (!process.env.OPENAI_API_KEY) {
                console.error('Erreur : La clé OPENAI_API_KEY est manquante dans les secrets !');
                process.exit(1);
              }
              
              const res = await fetch('https://openai.com', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + process.env.OPENAI_API_KEY,
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' // Contourne le blocage 403
                },
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [{role: 'user', content: 'Génère un fichier README.md propre et concis en français pour un projet React standard.'}]
                })
              });
              
              const data = await res.json();
              if (data.error) {
                console.error('Erreur API OpenAI:', data.error.message);
                process.exit(1);
              }
              
              const content = data.choices.message.content;
              fs.writeFileSync('README.md', content);
              console.log('Fichier README.md généré avec succès !');
            } catch (err) {
              console.error('Erreur d\'exécution du script:', err);
              process.exit(1);
            }
          }
          run();
          "

      - name: Commit and Push README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          git commit -m "Ajout automatique du README par ChatGPT" || echo "Pas de changements"
          git push
