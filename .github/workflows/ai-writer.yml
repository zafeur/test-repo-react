name: ChatGPT Automated Writer

on:
  push:
    branches: [ main ]

jobs:
  ai-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diagnostic OpenAI API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e "
          async function test() {
            try {
              const res = await fetch('https://openai.com', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + process.env.OPENAI_API_KEY
                },
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [{role: 'user', content: 'Test'}]
                })
              });
              
              console.log('Statut HTTP reçu :', res.status, res.statusText);
              const text = await res.text();
              console.log('--- DEBUT DE LA REPONSE DU SERVEUR ---');
              console.log(text.substring(0, 1000)); // Affiche les 1000 premiers caractères
              console.log('--- FIN DE LA REPONSE ---');
              process.exit(1); // On force l'arrêt pour lire le texte
            } catch (err) {
              console.error('Erreur réseau :', err);
            }
          }
          test();
          "
