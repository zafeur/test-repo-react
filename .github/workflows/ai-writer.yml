name: ChatGPT Automated Writer

on:
  push:
    branches: [ main ]

jobs:
  ai-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Generate README with ChatGPT API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          RESPONSE=$(curl -s https://openai.com \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "gpt-4o-mini",
              "messages": [{"role": "user", "content": "Génère un fichier README.md complet, professionnel et clair en français pour décrire un projet React standard. Donne uniquement le contenu du markdown, sans balise de code entourant le résultat."}]
            }')
          
          # Extraction du texte de la réponse JSON et création du fichier
          echo "$RESPONSE" | jq -r '.choices[0].message.content' > README.md

      - name: Commit and Push README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Ajout automatique du README par ChatGPT" || echo "Pas de changements"
          git push
